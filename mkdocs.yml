site_name: THD by NeverWitness
site_url: https://neverwitness.github.io/three-human-desires/
site_description: Three Human Desires

docs_dir: build_docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: zh
          name: 简体中文
          build: true
          default: true

        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home

            概述: Overview

            核心概念: Core Concepts
            基础模型与三欲: Base Model and Three Desires
            动力学变化与分析: Dynamics and Analysis

            解释能力: Explanatory Power
            局限性: Limitations
            相关理论: Related Theories

            可能的检验和预测: Possible Experiments and Predictions

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

draft_docs: |
  zh/_drafts/
  en/_drafts/

nav:
  - 首页: index.md

  - 理论:
      - 核心概念: core_concepts.md
      - 基础模型与三欲: base_model.md
      - 动力学变化与分析: dynamics_analysis.md

  - 解释与科学背景:
      - 解释能力: explanatory_power.md
      - 相关理论: related_theories.md

  - 验证与边界:
      - 局限性: limitations.md
      - 可检验预测: possible_verification.md
